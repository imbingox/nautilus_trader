name: Build PAPI candidate wheel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papi-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify candidate wheel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.15"
          enable-cache: false
      - name: Set up Rust
        run: |
          rustup show active-toolchain
          rustc -Vv
      - name: Build candidate wheel
        env:
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/papi-release/build-wheel.bash HEAD dist/papi
      - name: Verify candidate wheel
        run: bash scripts/papi-release/verify-wheel.bash dist/papi
      - name: Record source commit
        run: git rev-parse HEAD > dist/papi/source-commit.txt
      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papi-build-candidate
          path: dist/papi
          if-no-files-found: error
          retention-days: 30
